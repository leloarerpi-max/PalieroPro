<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" role="img" aria-label="PalieroPRO">
  <title>PalieroPRO</title>
  <!-- Icône carré arrondi avec marches -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#12163B"/>
    <!-- Marche 1 -->
    <rect x="14" y="46" width="12" height="12" rx="2" fill="#3347DB"/>
    <!-- Marche 2 -->
    <rect x="29" y="33" width="12" height="25" rx="2" fill="#5E6486"/>
    <!-- Marche 3 -->
    <rect x="44" y="20" width="12" height="38" rx="2" fill="#E8A02A"/>
  </g>

  <!-- Marque -->
  <text x="96" y="52" fill="#12163B" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" letter-spacing="-0.03em">
    Paliero<tspan fill="#3347DB">PRO</tspan>
  </text>
</svg>
